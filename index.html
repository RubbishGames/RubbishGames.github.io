<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Inspector</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #58a6ff; --text: #c9d1d9; --border: #30363d; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; }
        .header { margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .header h1 { font-size: 1.5rem; color: #f0f6fc; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 24px; border-radius: 8px; border: 1px solid var(--border); }
        h2 { color: var(--accent); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 0; margin-bottom: 20px; }
        .row { display: flex; justify-content: space-between; margin: 12px 0; font-size: 0.95rem; border-bottom: 1px solid #21262d; padding-bottom: 8px; }
        .row:last-child { border-bottom: none; }
        .label { color: #8b949e; }
        .value { font-weight: 600; color: #f0f6fc; text-align: right; font-family: ui-monospace, SFMono-Regular, monospace; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Device Analysis Report</h1>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Identity & Software</h2>
            <div class="row"><span class="label">Device Model:</span> <span id="model" class="value">Detecting...</span></div>
            <div class="row"><span class="label">OS Platform:</span> <span id="platform" class="value">--</span></div>
            <div class="row"><span class="label">Browser Engine:</span> <span id="engine" class="value">--</span></div>
            <div class="row"><span class="label">Architecture:</span> <span id="arch" class="value">--</span></div>
        </div>

        <div class="card">
            <h2>Hardware & Display</h2>
            <div class="row"><span class="label">CPU Logical Cores:</span> <span id="cores" class="value">--</span></div>
            <div class="row"><span class="label">System Memory:</span> <span id="ram" class="value">--</span></div>
            <div class="row"><span class="label">GPU Renderer:</span> <span id="gpu" class="value">--</span></div>
            <div class="row"><span class="label">Screen Resolution:</span> <span id="res" class="value">--</span></div>
        </div>
    </div>
</div>

<script>
    async function getSpecs() {
        const ua = navigator.userAgent;
        
        // 1. Identification Logic
        let model = "Desktop Computer";
        if (/PlayStation 5/.test(ua)) model = "PlayStation 5";
        else if (/PlayStation 4/.test(ua)) model = "PlayStation 4";
        else if (/Xbox/.test(ua)) model = "Xbox Console";
        else if (/Nintendo Switch/.test(ua)) model = "Nintendo Switch";
        else if (/Android/.test(ua)) {
            const match = ua.match(/Android\s+[\d\.]+;\s+([^;]+)\s+Build/);
            model = match ? match[1] : "Android Device";
        } else if (/iPhone|iPad/.test(ua)) {
            model = /iPad/.test(ua) ? "iPad" : "iPhone";
        }

        // 2. High Entropy Check (Chrome/Edge/Opera)
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
            const hints = await navigator.userAgentData.getHighEntropyValues(['model', 'architecture']);
            if (hints.model) model = hints.model;
            document.getElementById('arch').innerText = hints.architecture || "Unknown";
        } else {
            document.getElementById('arch').innerText = navigator.platform.includes('64') ? "x64" : "Unknown";
        }

        // 3. GPU Detection
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        let gpuName = "Generic/Software";
        if (gl) {
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            gpuName = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "Blocked";
            gpuName = gpuName.replace(/Angle \(.*?\)\s/g, ""); // Clean up string
        }

        // Update UI
        document.getElementById('model').innerText = model;
        document.getElementById('platform').innerText = navigator.platform;
        document.getElementById('engine').innerText = navigator.vendor || "Webkit/Gecko";
        document.getElementById('cores').innerText = navigator.hardwareConcurrency || "N/A";
        document.getElementById('ram').innerText = navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : "Unknown";
        document.getElementById('gpu').innerText = gpuName;
        document.getElementById('res').innerText = `${window.screen.width} x ${window.screen.height}`;
    }

    getSpecs();
</script>
</body>
</html>
