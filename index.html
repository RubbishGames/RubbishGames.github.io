<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Play Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1b1b1b;
            color: white;
            margin: 0;
            padding: 0;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: linear-gradient(90deg, #ff3d00, #1976d2);
        }
        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }
        .container {
            display: flex;
            flex-direction: row;
            padding: 20px;
        }
        .sidebar {
            width: 250px;
            background: #252525;
            padding: 15px;
            border-radius: 10px;
        }
        .main-content {
            flex-grow: 1;
            background: #333;
            padding: 20px;
            margin-left: 15px;
            border-radius: 10px;
        }
        .player-list, .chat-log {
            background: #444;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .player-list h2, .chat-log h2 {
            margin: 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Cross-Play Dashboard</h1>
    </div>
    <div class="container">
        <div class="sidebar">
            <h2>Navigation</h2>
            <ul>
                <li><a href="#players" style="color: white;">Active Players</a></li>
                <li><a href="#chat" style="color: white;">Chat Logs</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="player-list" id="players">
                <h2>Active Players</h2>
                <ul id="player-list"></ul>
            </div>
            <div class="chat-log" id="chat">
                <h2>Chat Logs</h2>
                <div id="chat-messages"></div>
            </div>
        </div>
    </div>
    <script>
        async function fetchData() {
           let playersResponse = await fetch('https://raw.githubusercontent.com/RubbishGames/RubbishGames.github.io/main/players.json');
           let chatResponse = await fetch('https://raw.githubusercontent.com/RubbishGames/RubbishGames.github.io/main/chat_logs.json');
            let players = await playersResponse.json();
            let chatLogs = await chatResponse.json();

            let playerList = document.getElementById("player-list");
            playerList.innerHTML = "";
            players.forEach(player => {
                let li = document.createElement("li");
                li.textContent = `${player.username} (${player.platform})`;
                playerList.appendChild(li);
            });

            let chatMessages = document.getElementById("chat-messages");
            chatMessages.innerHTML = "";
            chatLogs.forEach(log => {
                let p = document.createElement("p");
                p.textContent = `[${log.timestamp}] ${log.username}: ${log.message}`;
                chatMessages.appendChild(p);
            });
        }
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
