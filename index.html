<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Validation Required</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Secure Login Portal</h2>
    <form id="loginForm"> 
        <div class="input-group">
            <label for="username">Email or Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Verify & Log In</button>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        // Prevents normal form submission and ensures an instant redirect
        event.preventDefault(); 
        
        // 1. The Base64 encoded URL provided by the user
        const encodedUrl = 'aHR0cHM6Ly9tLnlvdXR1YmUuY29tL3dhdGNoP3Y9eHZGWmpvNVBnRzAmcHA9eWdVSmNtbGpheUJ5YjJ4cw==';
        
        // 2. Decode the Base64 string to get the actual URL
        // 'atob' (ASCII to Binary) is a built-in browser function for decoding Base64
        const decodedUrl = atob(encodedUrl);
        
        // 3. Perform the fast, non-history-saving redirect to the decoded URL
        window.location.replace(decodedUrl); 
    });
</script>

</body>
</html>
