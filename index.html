<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Explorer Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styles */
        #sidebar { width: 260px; background: #0b1120; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 15px; }
        .sidebar-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-bottom: 15px; font-weight: bold; }
        .room-item { padding: 10px; background: var(--panel); border-radius: 6px; margin-bottom: 8px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; border: 1px solid transparent; }
        .room-item:hover { border-color: var(--accent); }
        .btn-random { background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }

        /* Chat Area Styles */
        #main-chat { flex: 1; display: flex; flex-direction: column; }
        header { padding: 1rem; background: var(--panel); border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
        
        .msg { padding: 0.6rem 1rem; border-radius: 12px; max-width: 80%; line-height: 1.4; }
        .msg.me { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.them { background: var(--panel); align-self: flex-start; border-bottom-left-radius: 2px; }
        .sender { font-size: 0.65rem; font-weight: bold; display: block; opacity: 0.8; }

        footer { padding: 1rem; background: var(--panel); display: flex; gap: 0.5rem; }
        input { flex: 1; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
        button#send-btn { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<aside id="sidebar">
    <div class="sidebar-title">Explore</div>
    <button class="btn-random" onclick="teleport()">🎲 Teleport to Random Room</button>
    
    <div class="sidebar-title">Recent Rooms</div>
    <div id="room-list"></div>
</aside>

<main id="main-chat">
    <header>
        <div>Seed: <span id="room-title" style="color:var(--accent)">...</span></div>
        <div style="font-size: 0.7rem; opacity: 0.6;">Your Device: <span id="my-id">...</span></div>
    </header>

    <div id="chat-box"></div>

    <footer>
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </footer>
</main>

<script>
    // --- IDENTITY SETUP ---
    let deviceId = localStorage.getItem('chat_device_id') || 'DEV-' + Math.random().toString(36).substr(2, 6).toUpperCase();
    localStorage.setItem('chat_device_id', deviceId);
    document.getElementById('my-id').innerText = deviceId;

    // --- ROOM LOGIC ---
    let currentSeed = window.location.hash.substring(1);
    if (!currentSeed) {
        currentSeed = Math.random().toString(36).substring(7);
        window.location.hash = currentSeed;
    }
    document.getElementById('room-title').innerText = currentSeed;
    saveRoomToHistory(currentSeed);

    function teleport() {
        const newSeed = Math.random().toString(36).substring(7);
        window.location.hash = newSeed;
        location.reload(); // Reload to initialize new Peer connection
    }

    function saveRoomToHistory(seed) {
        let history = JSON.parse(localStorage.getItem('room_history') || '[]');
        if (!history.includes(seed)) {
            history.unshift(seed);
            history = history.slice(0, 10); // Keep last 10
            localStorage.setItem('room_history', JSON.stringify(history));
        }
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('room-list');
        const history = JSON.parse(localStorage.getItem('room_history') || '[]');
        list.innerHTML = history.map(s => `
            <div class="room-item" onclick="window.location.hash='${s}'; location.reload();">
                # ${s} ${s === currentSeed ? '⭐' : ''}
            </div>
        `).join('');
    }

    // --- PEERJS CONNECTION ---
    const peer = new Peer(`${currentSeed}-${deviceId}`);
    const activeConns = {};

    peer.on('open', (id) => {
        appendMessage('System', `Connected to room: ${currentSeed}`, 'them');
    });

    peer.on('connection', (conn) => {
        conn.on('data', (data) => {
            appendMessage(conn.peer.split('-').slice(1).join('-'), data, 'them');
        });
        activeConns[conn.peer] = conn;
    });

    // --- MESSAGING ---
    const input = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');

    function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        Object.values(activeConns).forEach(c => { if(c.open) c.send(text); });
        appendMessage('Me', text, 'me');
        input.value = '';
    }

    function appendMessage(sender, text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = `<span class="sender">${sender}</span>${text}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
