<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        h1 {
            color: #6a0dad;
        }
        .search-bar {
            margin: 20px 0;
        }
        .search-bar input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
        }
        .tiles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .tile {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 120px;
            transition: transform 0.2s;
        }
        .tile:hover {
            transform: scale(1.1);
        }
        .tile a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            display: block;
        }
        .add-tile {
            background: #6a0dad;
            color: #fff;
            padding: 10px;
            margin-top: 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="login-container">
        <h1>Login with Google</h1>
        <div id="g_id_onload"
            data-client_id="1049227155112-quk27gl5a3p359mjt3l9arov4h0ektub.apps.googleusercontent.com"
            data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <div id="dashboard" class="hidden">
        <div class="container">
            <h1 id="greeting"></h1>
            <div class="search-bar">
                <input type="text" placeholder="Search Google..." onkeydown="search(event)">
            </div>
            <div class="tiles" id="tiles">
                <div class="tile"><a href="https://mail.google.com" target="_blank">Gmail</a></div>
                <div class="tile"><a href="https://www.youtube.com" target="_blank">YouTube</a></div>
                <div class="tile"><a href="https://www.reddit.com" target="_blank">Reddit</a></div>
                <div class="tile"><a href="https://www.spotify.com" target="_blank">Spotify</a></div>
                <div class="tile"><a href="https://www.netflix.com" target="_blank">Netflix</a></div>
                <div class="tile"><a href="https://www.github.com" target="_blank">GitHub</a></div>
            </div>
            <button class="add-tile" onclick="addTile()">Add Tile</button>
        </div>
    </div>

    <script>
        function search(event) {
            if (event.key === "Enter") {
                const query = event.target.value;
                window.location.href = `https://www.google.com/search?q=${query}`;
            }
        }
        
        function addTile() {
            const url = prompt("Enter the URL:");
            const name = prompt("Enter the Name:");
            if (url && name) {
                const tileContainer = document.getElementById("tiles");
                const newTile = document.createElement("div");
                newTile.classList.add("tile");
                newTile.innerHTML = `<a href="${url}" target="_blank">${name}</a>`;
                tileContainer.appendChild(newTile);
            }
        }
        
        function handleCredentialResponse(response) {
            try {
                const tokenParts = response.credential.split(".");
                if (tokenParts.length !== 3) {
                    throw new Error("Invalid JWT structure.");
                }
                const payload = JSON.parse(atob(tokenParts[1].replace(/-/g, "+").replace(/_/g, "/")));
                document.getElementById("greeting").innerText = `Good Afternoon, ${payload.name}`;
                document.getElementById("login-container").classList.add("hidden");
                document.getElementById("dashboard").classList.remove("hidden");
            } catch (error) {
                console.error("Error processing login response:", error);
            }
        }
    </script>
</body>
</html>
