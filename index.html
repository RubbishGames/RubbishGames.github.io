<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specific Device ID</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; line-height: 1.5; background: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .label { font-weight: bold; color: #555; }
        .value { color: #007bff; margin-bottom: 1rem; font-size: 1.2rem; }
        hr { border: 0; border-top: 1px solid #eee; margin: 1rem 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Device Identity Report</h2>
    <hr>
    <div class="label">Detected Model/Type:</div>
    <div id="model" class="value">Identifying...</div>

    <div class="label">Screen Resolution:</div>
    <div id="resolution" class="value">--</div>

    <div class="label">Operating System:</div>
    <div id="os" class="value">--</div>
</div>

<script>
    function getDetailedModel() {
        const ua = navigator.userAgent;
        const width = window.screen.width;
        const height = window.screen.height;
        const ratio = window.devicePixelRatio;
        let model = "Unknown Device";

        // Logic for iOS Devices (which all report as "iPhone")
        if (/iPhone/.test(ua)) {
            if (width === 430 && height === 932) model = "iPhone 15/14 Pro Max";
            else if (width === 393 && height === 852) model = "iPhone 15/14 Pro";
            else if (width === 390 && height === 844) model = "iPhone 14/13/12";
            else model = "iPhone (Recent Model)";
        } 
        // Logic for Android (Often includes the model code in UA)
        else if (/Android/.test(ua)) {
            const match = ua.match(/Android\s+[\d\.]+;\s+([^;]+)\s+Build/);
            model = match ? match[1] : "Android Device";
        }
        // Logic for Mac/Windows
        else if (/Macintosh/.test(ua)) model = "MacBook / iMac";
        else if (/Windows/.test(ua)) model = "Windows PC";

        document.getElementById('model').innerText = model;
        document.getElementById('resolution').innerText = `${width} x ${height} (Ratio: ${ratio})`;
        document.getElementById('os').innerText = navigator.platform;
    }

    window.onload = getDetailedModel;
</script>

</body>
</html>
