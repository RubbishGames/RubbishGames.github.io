<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Generation & Star Sign Finder</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h2 {
            font-size: 20px;
        }
        input, button {
            font-size: 16px;
            padding: 5px;
            margin: 5px;
        }
        button {
            background-color: white;
            color: black;
        }
    </style>
    <script>
        function findDetails() {
            var dob = document.getElementById("dob").value;
            if (!dob.match(/^\d{4}-\d{2}-\d{2}$/)) {
                document.getElementById("result").innerHTML = "Enter a valid date (YYYY-MM-DD).";
                return;
            }
            var parts = dob.split("-");
            var year = parseInt(parts[0], 10);
            var month = parseInt(parts[1], 10);
            var day = parseInt(parts[2], 10);

            var generation = "Silent Generation";
            if (year >= 2025) generation = "Generation Beta";
            else if (year >= 2013) generation = "Generation Alpha";
            else if (year >= 1997) generation = "Generation Z";
            else if (year >= 1981) generation = "Millennials";
            else if (year >= 1965) generation = "Generation X";
            else if (year >= 1946) generation = "Baby Boomers";

            var zodiacSigns = [
                ["Capricorn", 19], ["Aquarius", 18], ["Pisces", 20], ["Aries", 19], ["Taurus", 20], ["Gemini", 20],
                ["Cancer", 22], ["Leo", 22], ["Virgo", 22], ["Libra", 22], ["Scorpio", 21], ["Sagittarius", 21]
            ];
            var zodiac = (day > zodiacSigns[month - 1][1]) ? zodiacSigns[month % 12][0] : zodiacSigns[month - 1][0];

            document.getElementById("result").innerHTML = "Generation: " + generation + "<br>Star Sign: " + zodiac;
        }
    </script>
</head>
<body>
    <h2>Generation & Star Sign Finder</h2>
    <label for="dob">Enter DOB (YYYY-MM-DD):</label>
    <input type="text" id="dob">
    <button onclick="findDetails()">Find</button>
    <p id="result"></p>
</body>
</html>
