<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Seeded Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 260px; background: #0b1120; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 15px; }
        .room-item { padding: 10px; background: var(--panel); border-radius: 6px; margin-bottom: 8px; cursor: pointer; font-size: 0.8rem; }
        #main-chat { flex: 1; display: flex; flex-direction: column; }
        #chat-box { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .msg { padding: 0.6rem; border-radius: 8px; max-width: 80%; font-size: 0.9rem; }
        .msg.me { background: var(--accent); color: #000; align-self: flex-end; }
        .msg.them { background: var(--panel); align-self: flex-start; }
        .sender { font-size: 0.6rem; font-weight: bold; display: block; opacity: 0.7; }
        footer { padding: 1rem; background: var(--panel); display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; background: #0f172a; color: white; }
        button { padding: 10px; background: var(--accent); border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<aside id="sidebar">
    <button style="width:100%; padding:10px; margin-bottom:20px;" onclick="teleport()">🎲 New Random Room</button>
    <div style="font-size:0.7rem; opacity:0.5; margin-bottom:10px;">RECENT ROOMS</div>
    <div id="room-list"></div>
</aside>

<main id="main-chat">
    <header style="padding:10px; background:var(--panel); border-bottom:1px solid #333; display:flex; justify-content:space-between;">
        <span>Room: <b id="room-title"></b></span>
        <span id="status" style="font-size:0.7rem; color:orange;">Connecting...</span>
    </header>
    <div id="chat-box"></div>
    <footer>
        <input type="text" id="msg-input" placeholder="Say hello...">
        <button id="send-btn">Send</button>
    </footer>
</main>

<script>
    const seed = window.location.hash.substring(1) || Math.random().toString(36).substring(7);
    if (!window.location.hash) window.location.hash = seed;
    document.getElementById('room-title').innerText = seed;

    // Device ID is stored so it stays consistent for you
    const deviceId = localStorage.getItem('chat_id') || 'USER-' + Math.random().toString(36).substring(7).toUpperCase();
    localStorage.setItem('chat_id', deviceId);

    // To find others, we use a predictable naming convention: seed-slot
    // We try to occupy a "slot" (0-10) in the room.
    let mySlot = 0;
    let peer = null;
    const connections = {};

    function initPeer(slot) {
        mySlot = slot;
        const peerId = `room-${seed}-slot-${slot}`;
        peer = new Peer(peerId);

        peer.on('open', () => {
            document.getElementById('status').innerText = "Online (Slot " + slot + ")";
            document.getElementById('status').style.color = "lightgreen";
            findPeers();
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                initPeer(slot + 1); // Try next slot if this one is taken
            }
        });

        peer.on('connection', (conn) => {
            setupConn(conn);
        });
    }

    function findPeers() {
        // Look for other users in slots 0-10
        for (let i = 0; i <= 10; i++) {
            if (i === mySlot) continue;
            const targetId = `room-${seed}-slot-${i}`;
            const conn = peer.connect(targetId);
            setupConn(conn);
        }
    }

    function setupConn(conn) {
        conn.on('open', () => {
            connections[conn.peer] = conn;
        });
        conn.on('data', (data) => {
            appendMessage(data.user, data.msg, 'them');
        });
    }

    function sendMessage() {
        const msg = document.getElementById('msg-input').value;
        if (!msg) return;
        
        Object.values(connections).forEach(conn => {
            if (conn.open) conn.send({ user: deviceId, msg: msg });
        });

        appendMessage(deviceId, msg, 'me');
        document.getElementById('msg-input').value = '';
    }

    function appendMessage(user, text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = `<span class="sender">${user}</span>${text}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function teleport() {
        window.location.hash = Math.random().toString(36).substring(7);
        location.reload();
    }

    document.getElementById('send-btn').onclick = sendMessage;
    initPeer(0); // Start trying to join at slot 0
</script>
</body>
</html>
