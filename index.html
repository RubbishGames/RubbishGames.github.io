<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SeedChat Explorer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar & Mobile Layout */
        #sidebar { 
            width: 300px; background: #0b1120; border-right: 1px solid #334155; 
            display: flex; flex-direction: column; padding: 15px; overflow-y: auto;
            transition: transform 0.3s ease; z-index: 1000;
        }
        @media (max-width: 768px) {
            #sidebar { position: fixed; height: 100%; transform: translateX(-100%); width: 85%; }
            #sidebar.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        }

        .sidebar-header { font-size: 0.7rem; color: var(--accent); margin-top: 25px; font-weight: 800; letter-spacing: 1px; }
        .room-item { padding: 14px; background: var(--panel); border-radius: 10px; margin-top: 8px; cursor: pointer; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; }
        .room-item:active { background: #334155; }
        .tag-live { color: #4ade80; font-size: 0.7rem; font-weight: bold; }

        /* Main Chat Area */
        #main-chat { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }
        header { padding: 15px; background: var(--panel); border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 15px; }
        #menu-toggle { font-size: 1.5rem; cursor: pointer; display: none; background: none; border: none; color: white; padding: 5px; }
        @media (max-width: 768px) { #menu-toggle { display: block; } }

        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; position: relative; }
        .msg.me { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.them { background: var(--panel); align-self: flex-start; border-bottom-left-radius: 2px; }
        .sender { font-size: 0.6rem; font-weight: bold; display: block; opacity: 0.7; margin-bottom: 3px; }

        /* Footer Controls */
        footer { padding: 15px; background: var(--panel); display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #334155; }
        .input-row { display: flex; gap: 8px; }
        input { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; }
        .btn { padding: 14px 18px; border-radius: 10px; border: none; background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .btn-paste { background: #64748b; color: white; }
        .btn:active { opacity: 0.7; }
    </style>
</head>
<body>

<aside id="sidebar">
    <button class="btn" style="width:100%" onclick="teleport()">🎲 NEW RANDOM ROOM</button>
    
    <div class="sidebar-header">LIVE ROOMS (GLOBAL)</div>
    <div id="discovered-list">
        <div style="font-size: 0.8rem; opacity: 0.5; padding: 10px;">Searching...</div>
    </div>

    <div class="sidebar-header">HISTORY</div>
    <div id="history-list"></div>
    
    <div style="margin-top:auto; font-size:0.6rem; opacity:0.4; text-align:center;">
        Device: <span id="my-id-display"></span>
    </div>
</aside>

<main id="main-chat">
    <header>
        <button id="menu-toggle" onclick="toggleMenu()">☰</button>
        <div style="flex:1">
            <div id="room-title" style="font-weight:bold; color:var(--accent); font-size:1.1rem;">...</div>
            <div id="status" style="font-size: 0.65rem; color: #94a3b8;">Connecting...</div>
        </div>
    </header>

    <div id="chat-box"></div>

    <footer>
        <div class="input-row">
            <input type="text" id="msg-input" placeholder="Paste message here..." readonly onclick="focusAndPaste(this)">
            <button class="btn btn-paste" onclick="pasteAndSend()">📋 Paste & Send</button>
        </div>
        <div style="font-size: 0.7rem; text-align: center; opacity: 0.5;">Tip: Click "Paste & Send" to send text from your clipboard</div>
    </footer>
</main>

<script>
    const seed = window.location.hash.substring(1) || Math.random().toString(36).substring(7);
    if (!window.location.hash) window.location.hash = seed;
    document.getElementById('room-title').innerText = "SEED: " + seed;

    const deviceId = localStorage.getItem('chat_id') || 'ID-' + Math.random().toString(36).substring(2, 7).toUpperCase();
    localStorage.setItem('chat_id', deviceId);
    document.getElementById('my-id-display').innerText = deviceId;

    let peer = null;
    const connections = {};
    const discoveredRooms = new Set();

    // --- PASTE LOGIC ---
    async function pasteAndSend() {
        try {
            const text = await navigator.clipboard.readText();
            if (text) {
                sendMessage(text);
            }
        } catch (err) {
            alert("Please allow clipboard access or paste manually into the box.");
        }
    }

    // --- P2P CORE ---
    function initPeer(slot) {
        const peerId = `room-${seed}-slot-${slot}`;
        peer = new Peer(peerId);

        peer.on('open', () => {
            updateStatus(`Online (Slot ${slot})`, "#4ade80");
            saveHistory(seed);
            
            // Connect to others in this specific seed
            for(let i=0; i<8; i++) {
                if(i !== slot) setupConn(peer.connect(`room-${seed}-slot-${i}`));
            }

            // Global Discovery: Signal presence to 'lobby' room
            setInterval(() => {
                const lobbyConn = peer.connect('room-lobby-slot-0');
                lobbyConn.on('open', () => {
                    lobbyConn.send({ type: 'HEARTBEAT', room: seed });
                    setTimeout(() => lobbyConn.close(), 500);
                });
            }, 8000);
        });

        peer.on('connection', (conn) => {
            // If we are slot-0, we act as a discovery node
            conn.on('data', data => {
                if (data.type === 'HEARTBEAT') updateDiscovery(data.room);
                if (data.msg) appendMessage(data.user, data.msg, 'them');
            });
            if (!data.type) connections[conn.peer] = conn;
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') initPeer(slot + 1);
        });
    }

    function setupConn(conn) {
        conn.on('data', (data) => {
            if (data.msg) appendMessage(data.user, data.msg, 'them');
        });
        connections[conn.peer] = conn;
    }

    function sendMessage(text) {
        if (!text) return;
        Object.values(connections).forEach(c => c.open && c.send({user: deviceId, msg: text}));
        appendMessage('Me', text, 'me');
    }

    function appendMessage(user, text, type) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = `<span class="sender">${user}</span>${text}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function updateDiscovery(roomName) {
        if (roomName === 'lobby' || roomName === seed) return;
        discoveredRooms.add(roomName);
        const list = document.getElementById('discovered-list');
        list.innerHTML = Array.from(discoveredRooms).map(r => `
            <div class="room-item" onclick="joinRoom('${r}')"># ${r} <span class="tag-live">LIVE</span></div>
        `).join('');
    }

    function saveHistory(s) {
        let h = JSON.parse(localStorage.getItem('chat_h') || '[]');
        if (!h.includes(s)) h.unshift(s);
        localStorage.setItem('chat_h', JSON.stringify(h.slice(0, 5)));
        document.getElementById('history-list').innerHTML = h.map(r => `<div class="room-item" onclick="joinRoom('${r}')"># ${r}</div>`).join('');
    }

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
    function joinRoom(r) { window.location.hash = r; location.reload(); }
    function teleport() { joinRoom(Math.random().toString(36).substring(7)); }
    function updateStatus(txt, color) { const s = document.getElementById('status'); s.innerText = txt; s.style.color = color; }

    initPeer(0);
</script>
</body>
</html>
