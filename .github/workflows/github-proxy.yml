name: GitHub Proxy API

on:
  repository_dispatch:
    types: [update-players]

jobs:
  update-players:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch existing players.json
        run: |
          curl -H "Authorization: token ${{ secrets.TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o players.json \
               https://api.github.com/repos/RubbishGames/RubbishGames.github.io/contents/players.json

      - name: Append new player data
        run: |
          echo '${{ github.event.client_payload.data }}' > newdata.json
          jq -s '.[0] + [.[1]]' players.json newdata.json > updated.json
          mv updated.json players.json

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add players.json
          git commit -m "Updated player list"
          git push
